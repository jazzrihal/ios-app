# SwiftLint configuration for CameraApp
# Docs: https://realm.github.io/SwiftLint/rule-directory.html

# ───────────────────────────── Paths ─────────────────────────────

included:
  - CameraApp
  - CameraAppUITests

excluded:
  - DerivedData
  - build
  - .build
  - Pods
  - Carthage

# ───────────────────────────── Rules ─────────────────────────────

disabled_rules:
  - trailing_comma              # SwiftFormat handles this; avoid duplicate warnings
  - opening_brace               # SwiftFormat handles brace placement

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - private_action
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# ───────────────────────── Rule Configuration ────────────────────

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3
  function_level: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - i
    - j
    - x
    - y
    - z
    - id
    - to
    - at

large_tuple:
  warning: 4
  error: 5

type_name:
  min_length:
    warning: 3
    error: 0
  max_length:
    warning: 50
    error: 60

multiline_arguments:
  only_enforce_after_first_closure_on_first_line: true

vertical_whitespace:
  max_empty_lines: 2
