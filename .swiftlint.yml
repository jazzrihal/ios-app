# SwiftLint — https://realm.github.io/SwiftLint/rule-directory.html

included:
  - CameraApp
  - CameraAppUITests

excluded:
  - DerivedData
  - build

disabled_rules:
  - trailing_comma        # SwiftFormat handles this
  - opening_brace         # SwiftFormat handles this

opt_in_rules:
  - contains_over_filter_count
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - identical_operands
  - implicit_return
  - last_where
  - modifier_order
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - yoda_condition

# Rule thresholds

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - i
    - j
    - x
    - y
    - z
    - id

vertical_whitespace:
  max_empty_lines: 2
