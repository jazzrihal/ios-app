name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BACKEND_REPO: jazzrihal/ios-app-backend
  SUPABASE_EXCLUDE: studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor
  # Fast PR feedback: auth + tab shell only. Run `make test` locally for full UI suite.
  CI_UI_SMOKE_TESTS: >-
    CameraAppUITests/CameraAppUITests/testExploreTabIsSelectedOnLaunch
    CameraAppUITests/CameraAppUITests/testAllTabsExist

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat xcodegen

      - name: Check formatting
        run: make format-check

      - name: Run SwiftLint (strict)
        run: make lint

  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: macos-15
    needs: lint
    steps:
      - name: Checkout ios-app
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat xcodegen

      - name: Write placeholder Secrets.plist
        run: chmod +x scripts/ci-write-secrets.sh scripts/ci-resolve-simulator.sh && ./scripts/ci-write-secrets.sh placeholder

      - name: Generate Xcode project
        run: make generate

      - name: Resolve simulator
        id: sim
        run: echo "device=$(./scripts/ci-resolve-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: make build DEVICE="${{ steps.sim.outputs.device }}"

      - name: Run unit tests
        run: make test-unit DEVICE="${{ steps.sim.outputs.device }}"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/test-results/unit-tests.xcresult
          if-no-files-found: ignore

  ui-tests:
    name: UI Smoke Tests (Simulator + Supabase)
    runs-on: macos-15
    needs: build-and-unit-test
    steps:
      - name: Checkout ios-app
        uses: actions/checkout@v4

      - name: Check backend repository access
        env:
          GH_TOKEN: ${{ secrets.IOS_APP_BACKEND_READ_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::UI smoke tests were not run because IOS_APP_BACKEND_READ_TOKEN is not configured."
            echo "::error::Configure IOS_APP_BACKEND_READ_TOKEN with read access to ${BACKEND_REPO}."
            exit 1
          fi

          if ! gh repo view "${BACKEND_REPO}" >/dev/null 2>&1; then
            echo "::warning::UI smoke tests were not run because ${BACKEND_REPO} is not accessible to IOS_APP_BACKEND_READ_TOKEN."
            echo "::error::Grant the token Contents: Read access to ${BACKEND_REPO}, or update BACKEND_REPO."
            exit 1
          fi

      - name: Checkout ios-app-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          path: ios-app-backend
          ref: main
          token: ${{ secrets.IOS_APP_BACKEND_READ_TOKEN }}

      - name: Install tools
        run: brew install swiftlint swiftformat xcodegen

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        working-directory: ios-app-backend
        run: supabase start -x ${{ env.SUPABASE_EXCLUDE }}

      - name: Reset database (migrations + seed)
        working-directory: ios-app-backend
        run: supabase db reset

      - name: Write Secrets.plist from local Supabase
        run: |
          eval "$(cd ios-app-backend && supabase status -o env)"
          chmod +x scripts/ci-write-secrets.sh scripts/ci-resolve-simulator.sh
          ./scripts/ci-write-secrets.sh local

      - name: Generate Xcode project
        run: make generate

      - name: Resolve simulator
        id: sim
        run: echo "device=$(./scripts/ci-resolve-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Run UI smoke tests
        run: |
          ONLY_FLAGS=()
          for test_id in ${{ env.CI_UI_SMOKE_TESTS }}; do
            ONLY_FLAGS+=(-only-testing "$test_id")
          done
          xcodebuild test \
            -scheme Pinstoria \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            "${ONLY_FLAGS[@]}" \
            -resultBundlePath build/test-results/ui-smoke-tests.xcresult

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-test-results
          path: build/test-results/ui-smoke-tests.xcresult
          if-no-files-found: ignore
