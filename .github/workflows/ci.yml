name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BACKEND_REPO: jazzrihal/ios-app-backend
  # Fast PR feedback: auth + tab shell only. Run `make test` locally for full UI suite.
  CI_UI_SMOKE_TESTS: >-
    CameraAppUITests/CameraAppUITests/testExploreTabIsSelectedOnLaunch
    CameraAppUITests/CameraAppUITests/testAllTabsExist

jobs:
  lint:
    name: Lint & Format
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat xcodegen

      - name: Check formatting
        run: make format-check

      - name: Run SwiftLint (strict)
        run: make lint

  build-and-test:
    name: Build, Unit & UI Smoke Tests
    runs-on: macos-15
    needs: lint
    steps:
      - name: Checkout ios-app
        uses: actions/checkout@v4

      - name: Checkout ios-app-backend seed data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          path: ios-app-backend
          ref: main
          token: ${{ secrets.IOS_APP_BACKEND_READ_TOKEN }}

      - name: Install tools
        run: brew install swiftlint swiftformat xcodegen libpq

      - name: Write Secrets.plist from hosted Supabase
        env:
          CI_SUPABASE_URL: ${{ vars.CI_SUPABASE_URL }}
          CI_SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY }}
        run: |
          chmod +x scripts/ci-write-secrets.sh scripts/ci-resolve-simulator.sh scripts/ci-reset-hosted-supabase.sh
          ./scripts/ci-write-secrets.sh hosted

      - name: Generate Xcode project
        run: make generate

      - name: Resolve simulator
        id: sim
        run: echo "device=$(./scripts/ci-resolve-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Prepare test output
        run: |
          mkdir -p build/test-results
          rm -rf build/test-results/unit-tests.xcresult build/test-results/ui-smoke-tests.xcresult

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme Pinstoria \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData

      - name: Run unit tests without rebuilding
        run: |
          xcodebuild test-without-building \
            -scheme Pinstoria \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData \
            -only-testing CameraAppTests \
            -resultBundlePath build/test-results/unit-tests.xcresult

      - name: Reset hosted Supabase test data
        env:
          CI_SUPABASE_DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}
        run: ./scripts/ci-reset-hosted-supabase.sh

      - name: Run UI smoke tests without rebuilding
        run: |
          ONLY_FLAGS=()
          for test_id in ${{ env.CI_UI_SMOKE_TESTS }}; do
            ONLY_FLAGS+=(-only-testing "$test_id")
          done
          xcodebuild test-without-building \
            -scheme Pinstoria \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData \
            "${ONLY_FLAGS[@]}" \
            -resultBundlePath build/test-results/ui-smoke-tests.xcresult

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/test-results/unit-tests.xcresult
          if-no-files-found: ignore

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-test-results
          path: build/test-results/ui-smoke-tests.xcresult
          if-no-files-found: ignore
