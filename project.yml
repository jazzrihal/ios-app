name: CameraApp
options:
  bundleIdPrefix: com.cameraapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  CameraApp:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - CameraAppUITests
    sources:
      - CameraApp
    info:
      path: CameraApp/Info.plist
      properties:
        NSCameraUsageDescription: "This app needs access to the camera to take pictures."
        NSPhotoLibraryAddUsageDescription: "This app saves captured photos to your photo library."
        NSLocationWhenInUseUsageDescription: "This app uses your location to find nearby image posts on the Explore map."
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameraapp.CameraApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: CameraApp/Info.plist
  CameraAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CameraAppUITests
    dependencies:
      - target: CameraApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: CameraApp
        GENERATE_INFOPLIST_FILE: YES
