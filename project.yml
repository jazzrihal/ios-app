name: Pinstoria
options:
  bundleIdPrefix: com.jazzrihal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.0.0"
targets:
  Pinstoria:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - CameraAppTests
        - CameraAppUITests
    sources:
      - CameraApp
    dependencies:
      - package: Supabase
      - package: Nuke
        product: NukeUI
    info:
      path: CameraApp/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "This app needs access to the camera to take pictures."
        NSPhotoLibraryAddUsageDescription: "This app saves captured photos to your photo library."
        NSLocationWhenInUseUsageDescription: "This app uses your location to find nearby image posts on the Explore map."
        CFBundleDisplayName: "Pinstoria"
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jazzrihal.pinstoria
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: CameraApp/Info.plist
    postCompileScripts:
      - script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --quiet
          else
            echo "warning: SwiftLint not installed — run: brew install swiftlint"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
  CameraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CameraAppTests
    dependencies:
      - target: Pinstoria
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pinstoria.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pinstoria"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  CameraAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CameraAppUITests
    dependencies:
      - target: Pinstoria
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: Pinstoria
        GENERATE_INFOPLIST_FILE: YES
